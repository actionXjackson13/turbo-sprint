<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/turbo-sprint/dj/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         values on notched iPhones; without it the insets are always 0.

         maximum-scale + user-scalable stop the accidental pinch-zoom that a
         phone held in one hand invites. Android honours them; iOS Safari has
         ignored user-scalable since iOS 10, which is what the gesture
         handlers in lib/viewportLock.ts are for. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="description" content="Request songs from the DJ at your event." />
    <!-- Standalone display + dark status bar when installed to the iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SoundBoard" />
    <link rel="apple-touch-icon" href="/turbo-sprint/dj/icons/apple-touch-icon.png" />
