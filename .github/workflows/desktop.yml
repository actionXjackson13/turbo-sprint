# Builds the SoundBoard desktop app.
#
# It runs on GitHub's own Windows machines because that is the only way to
# produce a Windows installer from this repository — packaging one needs
# Windows tooling that does not exist on the Linux box the app is developed on.
#
# Run it from the Actions tab ("Run workflow"), then download the installer from
# the run's Artifacts section. Nothing here is signed, so Windows will show a
# "Windows protected your PC" warning on first launch; that costs a few hundred
# dollars a year to remove and is not worth it yet.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: desktop
        run: npm install

      - name: Build the installer
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: SoundBoard-Windows
          # The installer and nothing else: the unpacked directory beside it is
          # several hundred megabytes and is not what anybody downloads.
          path: desktop/dist/*.exe
          if-no-files-found: error
